services:
  backend:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/nexusflow/data
      - ./workflows:/nexusflow/workflows
      - ./scripts:/nexusflow/scripts
    environment:
      - ENV=production
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always